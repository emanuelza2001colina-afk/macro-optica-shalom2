+++ docs/index.html (修改后)
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MACRO ÓPTICA SHALOM — Sistema de Gestión</title>
<link rel="icon" href="image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='20' fill='none' stroke='%23d97762' stroke-width='4'/%3E%3Ccircle cx='24' cy='24' r='9' fill='%23d97762'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   MACRO ÓPTICA SHALOM · Sistema de Gestión · archivo único
   ================================================================ */
:root{
  --salmon:#d97762; --salmon-deep:#c05f4b;
  --ink:#2d3748; --muted:#718096; --line:#cbd5e0;
  --paper:#ffffff; --bg:#eef1f6;
  --btn-blue:#2563eb; --btn-red:#dc2626; --btn-green:#16a34a; --btn-dark:#334155;
  --tab-blue:#3b82f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px;
  min-height:100vh; display:flex; flex-direction:column;
}
.font-display{font-family:"Space Grotesk","IBM Plex Sans",sans-serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* Fondo ambiente: retícula de hoja de cálculo + tintes suaves */
.sheet-bg{
  background:
    radial-gradient(900px 420px at 85% -120px, rgba(217,119,98,.13), transparent 62%),
    radial-gradient(820px 480px at -8% 108%, rgba(37,99,235,.08), transparent 60%),
    linear-gradient(to right, rgba(45,55,72,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(45,55,72,.045) 1px, transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;
}

/* ---------- Animaciones ---------- */
@keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tab-in{animation:tabIn .28s cubic-bezier(.22,1,.36,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.rise-in{animation:riseIn .35s cubic-bezier(.22,1,.36,1) both}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.toast-in{animation:toastIn .25s cubic-bezier(.22,1,.36,1) both}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
.toast-out{animation:toastOut .25s ease both}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.pop-in{animation:popIn .22s cubic-bezier(.22,1,.36,1) both}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shakeX .35s ease both}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.spin-slow{animation:spinSlow 26s linear infinite;transform-origin:center}
@keyframes growX{from{width:0}}
.grow-x{animation:growX .7s cubic-bezier(.22,1,.36,1) both}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}50%{box-shadow:0 0 0 5px rgba(245,158,11,0)}}
.pulse-dot{animation:pulseDot 2s ease-out infinite}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.fade-bg{animation:fadeBg .18s ease both}

/* ---------- Encabezado ---------- */
.hdr{
  position:relative; overflow:hidden; color:#fff;
  background:linear-gradient(105deg,#c05f4b 0%,#d97762 55%,#e08a76 100%);
  box-shadow:0 2px 10px rgba(96,42,30,.25);
}
.hdr-deco{position:absolute;pointer-events:none;color:#fff}
.hdr-deco.a{top:-64px;right:-56px;width:230px;height:230px;opacity:.16}
.hdr-deco.b{bottom:-110px;right:170px;width:260px;height:260px;opacity:.10}
.hdr-in{position:relative;max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:14px 18px}
.hdr-logo{display:flex;align-items:center;gap:12px}
.hdr h1{font-family:"Space Grotesk",sans-serif;font-size:1.45rem;line-height:1;font-weight:700;letter-spacing:.08em}
.hdr h1 em{font-style:normal;color:#fde8c8}
.hdr-sub{margin-top:5px;font-size:.66rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.hdr-right{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{border-radius:8px;padding:6px 12px;font-size:.72rem;font-weight:600}
.chip-tasa{background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
.chip-hora{background:rgba(15,23,42,.28)}
.chip-emp{display:inline-flex;align-items:center;gap:6px;background:#fbbf24;color:#78350f;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:5px 12px;font-size:.66rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* ---------- Estructura ---------- */
.wrap{flex:1;width:100%;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:232px 1fr;gap:16px;align-items:start;padding:16px 16px 22px}
#sidebar{position:sticky;top:14px;display:flex;flex-direction:column;gap:10px}
#module{min-width:0;padding-bottom:8px}

/* ---------- Botonera lateral ---------- */
.btn-side{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:12px 14px;border:none;border-radius:8px;color:#fff;
  font-family:"IBM Plex Sans",sans-serif;font-weight:700;font-size:.8rem;letter-spacing:.02em;text-transform:uppercase;text-align:left;
  cursor:pointer;box-shadow:0 2px 5px rgba(30,41,59,.18),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .1s ease,filter .15s ease,box-shadow .15s ease;
}
.btn-side:hover{filter:brightness(.93);box-shadow:0 4px 14px rgba(30,41,59,.24),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-side:active{transform:scale(.97)}
.btn-side .kbd{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.6rem;background:rgba(255,255,255,.22);border-radius:4px;padding:2px 5px;font-weight:600;letter-spacing:0}
.mini-draft{background:var(--paper);border:1px solid #dbe2ec;border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(23,32,48,.05)}
.mini-draft .lbl{font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
.mini-draft .oid{font-family:"IBM Plex Mono",monospace;margin-top:3px;font-size:.9rem;font-weight:700;color:#1d4ed8}
.mini-draft .nom{font-size:.78rem;font-weight:600;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-draft .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.mini-draft .tot{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed #e2e8f0;margin-top:9px;padding-top:9px}

/* ---------- Paneles ---------- */
.panel{background:var(--paper);border:1px solid #dbe2ec;border-radius:10px;box-shadow:0 1px 2px rgba(23,32,48,.05),0 10px 26px -20px rgba(23,32,48,.3);padding:16px}
.panel-title{
  font-family:"Space Grotesk",sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;padding:9px 12px;border:1.5px solid var(--ink);border-radius:6px;background:#f8fafc;margin-bottom:16px;
}
.cols3{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media(min-width:1280px){.cols3{grid-template-columns:1fr 1.05fr 1fr}}

/* ---------- Formularios ---------- */
.frm{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:.875rem;
  background:#fff;color:var(--ink);font-family:inherit;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.frm:focus{outline:none;border-color:var(--btn-blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.frm::placeholder{color:#a0aec0}
.field{margin-bottom:12px}
.field label{display:flex;justify-content:space-between;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
.field label .hint{color:#1d4ed8;font-family:"IBM Plex Mono",monospace;text-transform:none}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Tabla RX */
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th{background:#f1f5f9;border:1px solid #94a3b8;padding:7px 8px;font-weight:700;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:#475569}
.tbl td{border:1px solid #cbd5e1;padding:7px 9px}
.tbl tbody tr{transition:background .12s ease}
.tbl tbody tr:hover{background:#f5f9ff}
.tbl.clickable tbody tr{cursor:pointer}
.rx-cell{
  width:100%;border:none;background:transparent;text-align:center;padding:6px 2px;
  font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--ink);
}
.rx-cell:focus{outline:none;background:#eff6ff;box-shadow:inset 0 0 0 2px var(--btn-blue)}
.rx-cell::placeholder{color:#b7c2d0}

/* Mini resumen */
.mini-sum{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-top:14px}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:2px 0;font-size:.8rem}
.mini-row .k{color:#64748b}.mini-row .v{font-family:"IBM Plex Mono",monospace;font-weight:600;color:#334155}
.mini-row.total{border-top:2px solid #334155;margin-top:7px;padding-top:8px}
.mini-row.total .k{font-weight:800;color:#334155;letter-spacing:.05em;font-size:.72rem}
.mini-row.total .v{font-size:1.15rem;font-weight:700;color:#1d4ed8}
.saldo-box{margin-top:10px;display:flex;align-items:center;justify-content:space-between;border-radius:7px;padding:9px 12px;font-weight:800;font-size:.72rem;letter-spacing:.05em}
.saldo-box .v{font-family:"IBM Plex Mono",monospace;font-size:1rem}
.note-id{display:flex;align-items:center;justify-content:space-between;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:9px 12px;margin-bottom:12px}
.note-id .lbl{font-size:.6rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
.note-id .oid{font-family:"IBM Plex Mono",monospace;font-size:1rem;font-weight:700;color:#1e293b}
.info-line{display:flex;align-items:center;gap:6px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:6px 10px;font-size:.72rem;font-weight:600;margin-bottom:12px}
.hist-box{margin-top:14px;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:10px 12px;font-size:.72rem;color:#64748b}
.hist-box b{color:#475569;text-transform:uppercase;letter-spacing:.08em;font-size:.62rem;display:block;margin-bottom:3px}

/* Badges de estado */
.badge-est{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.64rem;font-weight:800;letter-spacing:.05em;white-space:nowrap}
.badge-est i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- Botones utilitarios ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:8px;padding:9px 15px;font-family:inherit;font-weight:700;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;transition:transform .1s ease,filter .15s ease,background .15s ease}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--btn-blue);color:#fff}.btn-primary:hover{filter:brightness(.92)}
.btn-green{background:var(--btn-green);color:#fff}.btn-green:hover{filter:brightness(.92)}
.btn-danger{background:var(--btn-red);color:#fff}.btn-danger:hover{filter:brightness(.92)}
.btn-dark{background:#1e293b;color:#fff}.btn-dark:hover{filter:brightness(1.2)}
.btn-ghost{background:#fff;border:1.5px solid #cbd5e1;color:#475569}.btn-ghost:hover{border-color:var(--btn-blue);color:#1d4ed8}
.btn-dash{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1.5px dashed #cbd5e1;background:transparent;border-radius:8px;padding:9px;font-family:inherit;font-weight:700;font-size:.72rem;color:#64748b;cursor:pointer;transition:all .15s ease}
.btn-dash:hover{border-color:#60a5fa;background:#eff6ff;color:#1d4ed8}
.btn-dash:disabled{opacity:.4;cursor:not-allowed}
.btn-icon{border:none;background:transparent;border-radius:6px;padding:5px;color:#94a3b8;cursor:pointer;display:inline-flex;transition:all .12s ease}
.btn-icon:hover{background:#eff6ff;color:#1d4ed8}
.btn-icon.red:hover{background:#fef2f2;color:#dc2626}
.btn-icon.green:hover{background:#f0fdf4;color:#16a34a}

/* ---------- Filtros ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters .grow{flex:1;min-width:210px;position:relative}
.filters .grow svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8}
.filters .grow input{padding-left:32px}
.filters select{width:auto}
.mod-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mod-head h2{font-family:"Space Grotesk",sans-serif;font-size:1rem;font-weight:700;letter-spacing:.06em;color:#1e293b}
.status-chip{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:#475569;background:#eef2f7;border:1px solid #dbe2ec;border-radius:5px;padding:3px 8px;white-space:nowrap}

/* ---------- Pestañas inferiores ---------- */
#tabs{position:sticky;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid #e2e8f0;box-shadow:0 -4px 16px rgba(30,41,59,.08)}
.tabs-inner{max-width:1500px;margin:0 auto;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:0 12px}
.sheet-tab{
  position:relative;display:flex;align-items:center;gap:7px;padding:10px 13px;background:transparent;border:none;
  border-radius:6px 6px 0 0;font-family:inherit;font-size:.72rem;font-weight:600;letter-spacing:.03em;color:#64748b;
  cursor:pointer;white-space:nowrap;transition:color .15s ease,background .15s ease;
}
.sheet-tab:hover{color:var(--ink);background:#eef2f7}
.sheet-tab.active{color:var(--tab-blue);background:#e8f0fe}
.sheet-tab.active::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;border-radius:3px;background:var(--tab-blue)}
.sheet-tab .lk{color:#f59e0b;display:inline-flex}
.tabs-stats{margin-left:auto;display:flex;gap:6px;padding-bottom:7px;flex-shrink:0}
@media(max-width:1023px){.tabs-stats{display:none}}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:900px){.kpis{grid-template-columns:1.3fr 1fr 1fr 1fr}}
.kpi{background:var(--paper);border:1px solid #dbe2ec;border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(23,32,48,.05)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc,#2563eb)}
.kpi .k{font-size:.62rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#94a3b8}
.kpi .v{font-family:"Space Grotesk",sans-serif;font-size:1.55rem;font-weight:700;color:#1e293b;margin-top:4px;line-height:1.05}
.kpi .s{font-size:.68rem;color:#64748b;margin-top:4px;font-family:"IBM Plex Mono",monospace}
.dash-grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:1000px){.dash-grid{grid-template-columns:1.15fr 1fr}}
.bar-row{display:grid;grid-template-columns:120px 1fr 78px;gap:10px;align-items:center;margin-bottom:11px}
.bar-row .bl{font-size:.66rem;font-weight:700;letter-spacing:.04em;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:14px;background:#f1f5f9;border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#2563eb,#60a5fa)}
.bar-row .bv{font-family:"IBM Plex Mono",monospace;font-size:.72rem;font-weight:700;color:#334155;text-align:right}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:140px}
.legend .li{display:flex;align-items:center;gap:8px;font-size:.74rem;color:#475569}
.legend .li i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend .li b{margin-left:auto;font-family:"IBM Plex Mono",monospace;color:#1e293b}
.recent-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #e2e8f0;font-size:.8rem}
.recent-row:last-child{border-bottom:none}
.recent-row .oid{font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:700;color:#1d4ed8;width:70px;flex-shrink:0}
.recent-row .nm{flex:1;font-weight:600;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-row .am{font-family:"IBM Plex Mono",monospace;font-weight:700;color:#1e293b}
.recent-row .sd{font-family:"IBM Plex Mono",monospace;font-size:.66rem;width:82px;text-align:right}

/* ---------- Laboratorio (kanban) ---------- */
.lab{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.lab{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){.lab{grid-template-columns:repeat(4,1fr)}}
.lab-col{background:rgba(255,255,255,.72);border:1px solid #dbe2ec;border-radius:10px;padding:10px;min-height:140px}
.lab-col h3{display:flex;align-items:center;gap:8px;font-family:"Space Grotesk",sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:#334155;padding:4px 4px 10px;border-bottom:2px solid var(--lc,#94a3b8);margin-bottom:10px}
.lab-col h3 .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;background:#eef2f7;border-radius:999px;padding:1px 9px;font-size:.68rem;color:#475569}
.lab-card{background:#fff;border:1px solid #e2e8f0;border-left:3px solid var(--lc,#94a3b8);border-radius:8px;padding:10px;margin-bottom:9px;box-shadow:0 1px 2px rgba(23,32,48,.06);transition:transform .12s ease,box-shadow .12s ease}
.lab-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px rgba(23,32,48,.3)}
.lab-card .oid{font-family:"IBM Plex Mono",monospace;font-size:.68rem;font-weight:700;color:#1d4ed8}
.lab-card .nm{font-size:.8rem;font-weight:700;color:#1e293b;margin:2px 0}
.lab-card .fe{font-size:.66rem;color:#64748b;font-family:"IBM Plex Mono",monospace}
.lab-card .fe.late{color:#dc2626;font-weight:700}
.lab-card .go{margin-top:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:6px;background:#f1f5f9;color:#334155;font-family:inherit;font-weight:700;font-size:.64rem;letter-spacing:.06em;padding:7px;cursor:pointer;transition:all .15s ease}
.lab-card .go:hover{background:#1e293b;color:#fff}

/* ---------- Steppers / chips / varios ---------- */
.stepper{display:inline-flex;align-items:center;gap:2px;border:1px solid #cbd5e1;border-radius:7px;overflow:hidden;background:#fff}
.stepper button{border:none;background:#f1f5f9;width:26px;height:26px;font-weight:800;font-size:.9rem;color:#475569;cursor:pointer;transition:background .12s}
.stepper button:hover{background:#dbeafe;color:#1d4ed8}
.stepper .val{min-width:34px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:700}
.pchip{display:inline-flex;flex-direction:column;border:1px solid #e2e8f0;background:#f8fafc;border-radius:8px;padding:6px 13px;margin:0 8px 8px 0}
.pchip .k{font-size:.58rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}
.pchip .v{font-family:"IBM Plex Mono",monospace;font-size:.85rem;font-weight:700;color:#334155}
.pct-bar{height:8px;width:84px;background:#f1f5f9;border-radius:5px;overflow:hidden;margin-left:auto}
.pct-bar i{display:block;height:100%;background:#16a34a;border-radius:5px}
.empty-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 12px;color:#94a3b8;text-align:center}
.empty-box p b{display:block;color:#64748b;font-size:.85rem}
.empty-box p span{font-size:.72rem}
.scroll-x{overflow-x:auto}
.mt{margin-top:12px}

/* ---------- Modales ---------- */
#modal-root:empty{display:none}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:#fff;border-radius:12px;box-shadow:0 24px 60px -20px rgba(15,23,42,.5);width:100%;max-height:86vh;overflow:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e2e8f0}
.modal-head h3{font-family:"Space Grotesk",sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#1e293b}
.modal-body{padding:16px 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.res-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;padding:10px 8px;border-radius:8px;cursor:pointer;font-family:inherit;transition:background .12s ease}
.res-row:hover{background:#eff6ff}
.res-row .oid{font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:700;color:#1d4ed8;width:74px;flex-shrink:0}
.res-row .mid{flex:1;min-width:0}
.res-row .mid b{display:block;font-size:.85rem;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-row .mid span{display:block;font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:#94a3b8}
.res-row .rgt{text-align:right}
.res-row .rgt b{display:block;font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:#334155}
.res-row .rgt span{display:block;font-family:"IBM Plex Mono",monospace;font-size:.64rem;font-weight:700}
.res-list{border-top:1px solid #f1f5f9}
.pin-input{width:100%;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:700;letter-spacing:.6em;padding:10px;border:1.5px solid var(--line);border-radius:8px}
.pin-input:focus{outline:none;border-color:var(--btn-blue);box-shadow:0 0 0 3px rgba(37,99,235,.16)}
.pin-err{margin-top:8px;text-align:center;font-size:.72rem;font-weight:700;color:#dc2626}
.pin-hint{margin-top:10px;font-size:.66rem;color:#94a3b8;text-align:center}

/* ---------- Toasts ---------- */
#toasts{position:fixed;right:16px;bottom:64px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(340px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;background:#1e293b;color:#fff;border-radius:9px;padding:11px 14px;font-size:.78rem;font-weight:600;box-shadow:0 10px 30px -10px rgba(15,23,42,.5)}
.toast.ok{background:#166534}.toast.err{background:#991b1b}.toast.info{background:#1d4ed8}
.toast svg{flex-shrink:0}

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#b9c4d2;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ---------- Responsive ---------- */
@media(max-width:1023px){
  .wrap{grid-template-columns:1fr}
  #sidebar{position:static;flex-direction:row;flex-wrap:wrap}

}

  #sidebar .btn-side{flex:1 1 100%}

}

const draftExists = () => S.orders.some(o => o.id === S.draft.id);
const draftSucio  = () => S.draft.nombre.trim() !== '' || S.draft.cedula.trim() !== '';

/* ================================================================
   6. PIEZAS DE INTERFAZ REUTILIZABLES
   ================================================================ */
const badge = e => { const c = ESTADO_COLOR[e] || ESTADO_COLOR.RECIBIDO;
  return '<span class="badge-est" style="background:'+c.bg+';color:'+c.fg+'"><i style="background:'+c.dot+'"></i>'+(ETIQ[e]||e)+'</span>'; };
const emptyBox = (msg, sub) => '<div class="empty-box">'+icon('inbox',30)+'<p><b>'+esc(msg)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</p></div>';
function selOpts(arr, sel){ return arr.map(o => '<option value="'+esc(o)+'"'+(o===sel?' selected':'')+'>'+esc(o)+'</option>').join(''); }
function catOpts(tipo, sel, ph){
  let h = '<option value="">'+ph+'</option>';
  S.catalogo.filter(i=>i.tipo===tipo).forEach(i => {
    h += '<option value="'+esc(i.codigo)+'"'+(i.codigo===sel?' selected':'')+'>'+esc(i.codigo)+' — '+esc(i.nombre)+' · '+fmtUSD(i.precio)+'</option>';
  });
  return h;
}
function filtersHTML(fKey, f, opts){
  let h = '<div class="filters">' +
    '<div class="grow">'+icon('search',14)+'<input class="frm" data-k="'+fKey+'.q" placeholder="Buscar paciente, cédula u orden…" value="'+esc(f.q)+'"></div>' +
    '<select class="frm" data-k="'+fKey+'.sede"><option value="">Todas las sedes</option>'+selOpts(S.config.sedes, f.sede)+'</select>';
  if(opts && opts.estado)
    h += '<select class="frm" data-k="'+fKey+'.estado"><option value="">Todos los estados</option>'+selOpts(ESTADOS, f.estado)+'</select>';
  return h + '</div>';
}
function matchQ(q, o){
  const s = (q||'').trim().toLowerCase();
  if(!s) return true;
  return o.nombre.toLowerCase().includes(s) || o.cedula.toLowerCase().includes(s) || o.id.toLowerCase().includes(s) || (o.telefono||'').toLowerCase().includes(s);
}

/* ---- DASHBOARD ---- */
function donut(data, center){
  const total = data.reduce((a,x)=>a+x.value,0);
  const C = 2*Math.PI*40; let off = 0, segs = '';
  data.forEach(x => {
    if(x.value <= 0) return;
    const len = (x.value/(total||1))*C;
    segs += '<circle cx="60" cy="60" r="40" fill="none" stroke="'+x.color+'" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 60 60)"/>';
    off += len;
  });
  return '<svg viewBox="0 0 120 120" width="168" height="168">' + (segs || '<circle cx="60" cy="60" r="40" fill="none" stroke="#e2e8f0" stroke-width="16"/>') +
    '<text x="60" y="57" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="24" font-weight="700" fill="#1e293b">'+center+'</text>' +
    '<text x="60" y="73" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-size="8.5" letter-spacing="1.5" fill="#94a3b8">ÓRDENES</text></svg>';
}

  const sedes = S.config.sedes.map(s => ({s, v:S.orders.filter(o=>o.sede===s).reduce((a,o)=>a+orderTotal(o),0)}));
  const maxS = Math.max(1, ...sedes.map(x=>x.v));
  const bars = sedes.map((x,i) =>
    '<div class="bar-row"><span class="bl">'+esc(x.s)+'</span>' +

  const legend = est.map(x => '<div class="li"><i style="background:'+x.color+'"></i>'+esc(x.label)+'<b>'+x.value+'</b></div>').join('');

  const recent = S.orders.slice().sort((a,b)=>b.creado-a.creado).slice(0,5).map(o => {
    const t = orderTotal(o), s = round2(t - paidUSD(o));
    return '<div class="recent-row"><span class="oid">'+esc(o.id)+'</span><span class="nm">'+esc(o.nombre)+'</span>' +
      '<span class="am">'+fmtUSD(t)+'</span>' +
      '<span class="sd" style="color:'+(s>0?'#b45309':'#16a34a')+'">'+(s>0?fmtUSD(s):'pagado')+'</span>'+badge(o.estado)+'</div>';

  return '<div>' +
    '<div class="kpis">' +

/* ---- LABORATORIO ---- */
function mod_laboratorio(){
  const hoy = todayISO();
  const cols = ESTADOS.map(e => {
    const items = S.orders.filter(o=>o.estado===e).sort((a,b)=>a.entrega.localeCompare(b.entrega));
    const cards = items.map(o => {
      const late = e!=='ENTREGADO' && o.entrega && o.entrega < hoy;
      return '<div class="lab-card" style="--lc:'+ESTADO_COLOR[e].dot+'">' +
        '<div class="oid">'+esc(o.id)+'</div><div class="nm">'+esc(o.nombre)+'</div>' +
        '<div class="fe'+(late?' late':'')+'">Entrega: '+fmtFecha(o.entrega)+(late?' · ATRASADA':'')+'</div>' +
        (e!=='ENTREGADO' ? '<button class="go" data-act="avanzar" data-id="'+esc(o.id)+'">'+esc(ACCION[e])+' '+icon('arrow',11)+'</button>'
                         : '<div class="fe" style="color:#16a34a;font-weight:700;display:flex;align-items:center;gap:5px">'+icon('check',12)+' Completada</div>') +
      '</div>';
    }).join('') || '<div style="text-align:center;color:#b6c0cd;font-size:.7rem;padding:14px 0">— vacío —</div>';
    return '<div class="lab-col" style="--lc:'+ESTADO_COLOR[e].dot+'"><h3><i style="width:9px;height:9px;border-radius:50%;background:'+ESTADO_COLOR[e].dot+';display:inline-block"></i>'+(e==='LABORATORIO'?'EN LABORATORIO':e)+'<span class="cnt">'+items.length+'</span></h3>'+cards+'</div>';
  }).join('');
  return '<section class="panel"><div class="mod-head"><h2>FLUJO DE LABORATORIO</h2><span class="status-chip">avance de producción</span></div><div class="lab">'+cols+'</div></section>';
}

      '<td style="font-weight:600">'+esc(i.nombre)+'<div style="font-size:.66rem;color:#94a3b8">'+esc(i.detalle)+'</div></td>' +
      '<td class="mono" style="font-weight:700">'+fmtUSD(i.precio)+'</td>' +
      '<td><span class="stepper"><button data-act="stock" data-id="'+esc(i.codigo)+'" data-d="-1" title="Restar">−</button><span class="val">'+i.stock+'</span><button data-act="stock" data-id="'+esc(i.codigo)+'" data-d="1" title="Sumar">+</button></span></td>' +

/* ---- IMPUESTOS ---- */
function mod_impuestos(){
  const ordMes = S.orders.filter(o => (o.fecha||'').slice(0,7) === S.mes);
  let baseIVA = 0, baseIGTF = 0;
  const rows = ordMes.map(o => {
    const abonos = o.pagos.map(p => ({usd:num(p.usd), bs:num(p.bs), metodo:p.metodo})).filter(p => p.usd>0 || p.bs>0);
    const eq = abonos.reduce((a,p)=>a+p.usd+p.bs/(S.config.tasa||1),0);
    const usdDirecto = abonos.filter(p=>p.metodo==='EFECTIVO $'||p.metodo==='ZELLE').reduce((a,p)=>a+p.usd,0);
    baseIVA += eq; baseIGTF += usdDirecto;
    return {o, eq, usdDirecto};
  });
  baseIVA = round2(baseIVA); baseIGTF = round2(baseIGTF);
  const iva = round2(baseIVA*0.16), igtf = round2(baseIGTF*0.03), totalRet = round2(iva+igtf);

  const cards =
    '<div class="kpis" style="margin-bottom:14px">' +
      '<div class="kpi" style="--acc:#2563eb"><div class="k">Base imponible</div><div class="v">'+fmtUSD(baseIVA)+'</div><div class="s">'+fmtBs(round2(baseIVA*S.config.tasa))+'</div></div>' +
      '<div class="kpi" style="--acc:#d97762"><div class="k">IVA 16%</div><div class="v">'+fmtUSD(iva)+'</div><div class="s">'+fmtBs(round2(iva*S.config.tasa))+'</div></div>' +
      '<div class="kpi" style="--acc:#f59e0b"><div class="k">IGTF 3% (pagos USD)</div><div class="v">'+fmtUSD(igtf)+'</div><div class="s">efectivo $ y Zelle</div></div>' +
      '<div class="kpi" style="--acc:#16a34a"><div class="k">Total retenciones</div><div class="v">'+fmtUSD(totalRet)+'</div><div class="s">período '+esc(S.mes)+'</div></div>' +
    '</div>';

  const body = rows.map(({o,eq,usdDirecto}) =>
    '<tr><td class="mono" style="font-weight:700;color:#1d4ed8">'+esc(o.id)+'</td>' +
    '<td style="font-weight:600">'+esc(o.nombre)+'</td><td class="mono">'+fmtFecha(o.fecha)+'</td>' +
    '<td class="mono">'+fmtUSD(eq)+'</td>' +
    '<td class="mono">'+fmtUSD(round2(eq*0.16))+'</td>' +
    '<td class="mono">'+(usdDirecto?fmtUSD(round2(usdDirecto*0.03)):'—')+'</td></tr>').join('');

  return '<section class="panel"><div class="mod-head"><h2>IMPUESTOS · ESTIMACIÓN MENSUAL</h2>' +
    '<input class="frm mono" type="month" data-k="mes" value="'+esc(S.mes)+'" style="width:auto"></div>' +
    cards +
    '<p style="margin-bottom:12px;border:1px solid #fef3c7;background:#fffbeb;border-radius:7px;padding:8px 12px;font-size:.72rem;color:#92400e">' +
    '<b>'+icon('alert',12)+'</b> Estimación referencial sobre los abonos registrados en el período. Verifique con su contador antes de declarar.</p>' +
    (rows.length===0 ? emptyBox('Sin operaciones en '+S.mes)
      : '<div class="scroll-x"><table class="tbl"><thead><tr><th>Orden</th><th>Paciente</th><th>Fecha</th><th>Base ($)</th><th>IVA 16%</th><th>IGTF 3%</th></tr></thead><tbody>'+body+'</tbody>' +
        '<tfoot><tr style="background:#f1f5f9;font-weight:700"><td colspan="3" style="text-align:right;font-size:.7rem;letter-spacing:.1em">TOTALES</td><td class="mono">'+fmtUSD(baseIVA)+'</td><td class="mono" style="color:#b45309">'+fmtUSD(iva)+'</td><td class="mono" style="color:#b45309">'+fmtUSD(igtf)+'</td></tr></tfoot></table></div>') +
  '</section>';
}

let lastTab = null;
function render(){
  /* captura de foco para restaurarlo tras re-pintar */
  const ae = document.activeElement;
  let fk = null;
  if(ae && ae.dataset && ae.dataset.k){
    fk = {k:ae.dataset.k};
    try{ fk.s = ae.selectionStart; fk.e = ae.selectionEnd; }catch(e){}
  }

  /* header */
  $('#chip-tasa').textContent = fmtTasa(S.config.tasa);
  const ce = $('#chip-empleado');
  if(S.config.empleado){ ce.classList.remove('hidden'); ce.innerHTML = icon('lock',11)+' MODO EMPLEADO'; }
  else ce.classList.add('hidden');

  /* sidebar */
  const dr = S.draft;
  $('#sidebar').innerHTML =
    '<button class="btn-side" style="background:#7094b8" data-act="save">'+icon('save',16)+' Guardar / Actualizar <span class="kbd">Ctrl+S</span></button>' +
    '<button class="btn-side" style="background:#dc2626" data-act="del">'+icon('trash',16)+' Eliminar</button>' +
    '<button class="btn-side" style="background:#16a34a" data-act="buscar">'+icon('search',16)+' Buscar <span class="kbd">Ctrl+K</span></button>' +
    '<button class="btn-side" style="background:#2563eb" data-act="nueva">'+icon('plus',16)+' Nueva Orden <span class="kbd">Alt+N</span></button>' +
    '<button class="btn-side" style="background:'+(S.config.empleado?'#b45309':'#334155')+'" data-act="empleado">'+icon(S.config.empleado?'lock':'unlock',16)+' Modo Empleado</button>' +
    '<div class="mini-draft"><div class="lbl">En edición</div><div class="oid">'+esc(dr.id)+'</div>' +
    '<div class="nom">'+(esc(dr.nombre)||'— sin paciente —')+'</div>' +
    '<div class="row"><span class="mono" style="font-size:.7rem;color:#64748b">'+fmtFecha(dr.fecha)+'</span>'+badge(dr.estado)+'</div>' +
    '<div class="tot"><span class="lbl">Total</span><span class="mono" style="font-weight:700;font-size:.9rem">'+fmtUSD(orderTotal(dr))+'</span></div></div>';

  /* pestañas */
  const suma = S.orders.reduce((a,o)=>a+orderTotal(o),0);
  $('#tabs-inner').innerHTML = TABS.map(t => {
    const locked = S.config.empleado && t.gate;
    return '<button class="sheet-tab'+(S.tab===t.id?' active':'')+'" data-act="tab" data-id="'+t.id+'" title="'+t.label+'">' +
      icon(t.ic,13)+t.label+(locked?'<span class="lk">'+icon('lock',10)+'</span>':'')+'</button>';
  }).join('') +
  '<div class="tabs-stats"><span class="status-chip">Recuento: '+S.orders.length+'</span><span class="status-chip">Suma: '+fmtUSD(suma)+'</span></div>';

  /* módulo */
  $('#module').innerHTML = (MODS[S.tab] || mod_formulario)();
  if(lastTab !== S.tab){
    const m = $('#module');
    m.classList.remove('tab-in'); void m.offsetWidth; m.classList.add('tab-in');
    lastTab = S.tab;
  }

  renderModal();

  /* restaurar foco */
  if(fk){
    const el = document.querySelector('[data-k="'+fk.k+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(fk.s, fk.e); }catch(e){} }
  }
}

/* ================================================================
   9. MODALES Y TOASTS
   ================================================================ */
function modalShell(title, body, width){
  return '<div class="modal-bg fade-bg" data-act="modal-bg"><div class="modal-card pop-in" style="max-width:'+(width||560)+'px">' +
    '<div class="modal-head"><h3>'+title+'</h3><button class="btn-icon red" data-act="modal-cerrar" title="Cerrar">'+icon('x',16)+'</button></div>' +
    '<div class="modal-body">'+body+'</div></div></div>';
}
function buscarResults(){
  const q = (S.buscarQ||'').trim().toLowerCase();
  const lista = (q ? S.orders.filter(o =>
      o.nombre.toLowerCase().includes(q) || o.cedula.toLowerCase().includes(q) ||
      o.id.toLowerCase().includes(q) || (o.telefono||'').toLowerCase().includes(q))
    : S.orders).slice().sort((a,b)=>b.creado-a.creado).slice(0,8);
  if(!lista.length) return emptyBox('Sin coincidencias','Revise la cédula o el nombre del paciente');
  return '<div class="res-list">'+lista.map(o => {
    const t = orderTotal(o), s = round2(t - paidUSD(o));
    return '<button class="res-row" data-act="buscar-pick" data-id="'+esc(o.id)+'">' +
      '<span class="oid">'+esc(o.id)+'</span>' +
      '<span class="mid"><b>'+esc(o.nombre)+'</b><span>'+esc(o.cedula)+' · '+fmtFecha(o.fecha)+' · '+esc(o.sede||'sede —')+'</span></span>' +
      '<span class="rgt"><b>'+fmtUSD(t)+'</b><span style="color:'+(s>0?'#b45309':'#16a34a')+'">'+(s>0?'debe '+fmtUSD(s):'pagado')+'</span></span>' +
      badge(o.estado)+'</button>';
  }).join('')+'</div>';
}
function renderModal(){
  const m = S.modal; const root = $('#modal-root');
  if(!m){ root.innerHTML = ''; return; }
  if(m.tipo === 'buscar'){
    root.innerHTML = modalShell('Buscar paciente u orden',
      '<div style="position:relative;margin-bottom:12px">'+
      '<span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8">'+icon('search',15)+'</span>'+
      '<input class="frm" style="padding-left:34px" data-k="buscarQ" placeholder="Nombre, cédula, teléfono u orden… (ej: ORD-0005)" value="'+esc(S.buscarQ)+'"></div>' +
      buscarResults() +
      '<p style="margin-top:12px;border-top:1px solid #f1f5f9;padding-top:8px;font-size:.66rem;color:#94a3b8">Consejo: pulse <span class="mono" style="background:#f1f5f9;border-radius:4px;padding:1px 5px">Ctrl+K</span> desde cualquier módulo para abrir esta búsqueda.</p>', 600);
  }
  else if(m.tipo === 'pin'){
    root.innerHTML = modalShell('PIN de supervisor',
      '<p style="font-size:.85rem;color:#64748b;margin-bottom:12px">Ingrese el PIN para desactivar el <b>modo empleado</b> y acceder a los módulos administrativos.</p>' +
      '<input type="password" inputmode="numeric" maxlength="4" class="pin-input'+(S.pinError?' shake':'')+'" data-k="pin" placeholder="••••" value="'+esc(S.pin)+'">' +
      (S.pinError ? '<div class="pin-err">PIN incorrecto, intente de nuevo</div>' : '') +
      '<div class="pin-hint">PIN de demostración: 1234</div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" data-act="modal-cerrar">Cancelar</button>' +
      '<button class="btn btn-dark" data-act="pin-ok">'+icon('unlock',13)+' Desbloquear</button></div>', 380);
  }
  else if(m.tipo === 'delReg'){
    root.innerHTML = modalShell('Eliminar orden',
      '<p style="font-size:.88rem;color:#475569">¿Eliminar la orden <b class="mono">'+esc(m.id)+'</b>? Esta acción no se puede deshacer.</p>' +
      '<div class="modal-actions"><button class="btn btn-ghost" data-act="modal-cerrar">Cancelar</button>' +
      '<button class="btn btn-danger" data-act="del-registro-ok">'+icon('trash',13)+' Eliminar</button></div>', 400);
  }
  else if(m.tipo === 'nueva'){
    root.innerHTML = modalShell('Orden sin guardar',
      '<p style="font-size:.88rem;color:#475569">Hay datos sin guardar en <b class="mono">'+esc(S.draft.id)+'</b>. Si crea una nueva orden se perderán. ¿Continuar?</p>' +
      '<div class="modal-actions"><button class="btn btn-ghost" data-act="modal-cerrar">Seguir editando</button>' +
      '<button class="btn btn-primary" data-act="nueva-ok">'+icon('plus',13)+' Crear nueva</button></div>', 400);
  }
  else if(m.tipo === 'reset'){
    root.innerHTML = modalShell('Reiniciar datos de demostración',
      '<p style="font-size:.88rem;color:#475569">Se borrarán todas las órdenes, gastos y ajustes del navegador y se cargarán los datos de demostración. ¿Continuar?</p>' +
      '<div class="modal-actions"><button class="btn btn-ghost" data-act="modal-cerrar">Cancelar</button>' +
      '<button class="btn btn-danger" data-act="reset-ok">'+icon('alert',13)+' Sí, reiniciar</button></div>', 420);
  }
  /* auto-focus en el primer input del modal */
  const inp = root.querySelector('input[data-k]');
  if(inp) setTimeout(()=>{ inp.focus(); try{ inp.setSelectionRange(inp.value.length, inp.value.length); }catch(e){} }, 30);
}

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast toast-in ' + (type || 'ok');
  const ic = type === 'err' ? 'alert' : type === 'info' ? 'eye' : 'check';
  el.innerHTML = icon(ic, 15) + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.classList.add('toast-out'); setTimeout(()=>el.remove(), 260); }, 3000);
}

/* ================================================================
   10. ACCIONES DE NEGOCIO
   ================================================================ */
function guardar(){
  const dr = S.draft;
  if(!dr.nombre.trim() || !dr.cedula.trim()){
    toast('Complete nombre y cédula antes de guardar', 'err');
    S.tab = 'formulario'; render(); return;
  }
  const ex = draftExists();
  if(ex) S.orders = S.orders.map(o => o.id === dr.id ? Object.assign({}, dr, {creado:o.creado}) : o);
  else S.orders.push(JSON.parse(JSON.stringify(dr)));
  persist(); render();
  toast(ex ? 'Orden '+dr.id+' actualizada' : 'Orden '+dr.id+' guardada');
}
function cargarOrden(id){
  const o = S.orders.find(x => x.id === id);
  if(!o) return;
  S.draft = JSON.parse(JSON.stringify(o));
  persistDraft();
  S.tab = 'formulario'; render();
  toast('Orden '+id+' cargada en el formulario', 'info');
}
function eliminarOrden(id){
  S.orders = S.orders.filter(o => o.id !== id);
  if(S.draft.id === id) S.draft = blankOrder(nextOrderId());
  persist(); render();
  toast('Orden '+id+' eliminada', 'err');
}
function nuevaOrden(){
  if(draftSucio() && !draftExists()){ S.modal = {tipo:'nueva'}; render(); return; }
  S.draft = blankOrder(nextOrderId()); persistDraft();
  S.tab = 'formulario'; render();
  toast('Nueva orden en edición: '+S.draft.id, 'info');
}
function avanzar(id){
  const o = S.orders.find(x => x.id === id);
  if(!o || o.estado === 'ENTREGADO') return;
  o.estado = SIGUIENTE[o.estado];
  if(S.draft.id === id) S.draft.estado = o.estado;
  persist(); render();
  toast(o.estado === 'LISTO' ? '¡Orden '+id+' lista para entregar!' : 'Orden '+id+' → '+o.estado, o.estado === 'LISTO' ? 'ok' : 'info');
}
function irATab(id){
  const t = TABS.find(x => x.id === id);
  if(S.config.empleado && t && t.gate){ S.modal = {tipo:'pin'}; render(); return; }
  S.tab = id; render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function toggleEmpleado(){
  if(S.config.empleado){ S.modal = {tipo:'pin'}; S.pin = ''; S.pinError = false; render(); }
  else{
    S.config.empleado = true;
    const t = TABS.find(x => x.id === S.tab);
    if(t && t.gate) S.tab = 'formulario';
    persist(); render();
    toast('Modo empleado ACTIVADO — módulos sensibles bloqueados', 'info');
  }
}
function pinOk(){
  if(!S.modal || S.modal.tipo !== 'pin') return;
  if(S.pin === PIN_EMPLEADO){
    S.config.empleado = false; S.modal = null; S.pin = '';
    persist(); render();
    toast('Modo empleado desactivado — acceso completo');
  }else{
    S.pin = ''; S.pinError = true; render();
  }
}
function exportCSV(){
  const f = S.filtroV;
  const rows = S.orders.filter(o => (!f.sede || o.sede===f.sede) && matchQ(f.q,o)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const head = 'Orden;Fecha;Paciente;Cedula;Sede;Montura;Cristal;Total USD;Estado';
  const body = rows.map(o => [o.id,o.fecha,o.nombre,o.cedula,o.sede,nombreItem(o.montura),nombreItem(o.cristal),orderTotal(o).toFixed(2),o.estado].join(';'));
  const blob = new Blob(['\uFEFF' + [head].concat(body).join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'ventas-macro-optica.csv'; a.click();
  URL.revokeObjectURL(a.href);
  toast('Libro de ventas exportado a CSV');
}
function backup(){
  const data = {v:1, app:'macro-optica-shalom', fecha:new Date().toISOString(), orders:S.orders, gastos:S.gastos, config:S.config, catalogo:S.catalogo};
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'backup-macro-optica-' + todayISO() + '.json'; a.click();
  URL.revokeObjectURL(a.href);
  toast('Respaldo descargado');
}
function importFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data.orders)) throw new Error('formato');
      S.orders = data.orders;
      S.gastos = Array.isArray(data.gastos) ? data.gastos : [];
      if(data.config) S.config = Object.assign({}, SEED_CONFIG, data.config);
      if(Array.isArray(data.catalogo) && data.catalogo.length) S.catalogo = data.catalogo;
      S.draft = blankOrder(nextOrderId());
      persist(); render();
      toast('Respaldo importado: '+S.orders.length+' órdenes');
    }catch(e){ toast('Archivo de respaldo inválido', 'err'); }
  };
  reader.readAsText(file);
}
function resetDemo(){
  try{ Object.values(LS).forEach(k => localStorage.removeItem(k)); }catch(e){}
  S.orders = JSON.parse(JSON.stringify(SEED_ORDERS));
  S.gastos = JSON.parse(JSON.stringify(SEED_GASTOS));
  S.config = JSON.parse(JSON.stringify(SEED_CONFIG));
  S.catalogo = JSON.parse(JSON.stringify(CATALOGO));
  S.draft = blankOrder(nextOrderId());
  S.modal = null; S.tab = 'formulario';
  persist(); render();
  toast('Datos de demostración restaurados', 'info');
}
function tasaAplicar(){
  const el = $('#tasa-input');
  const v = parseFloat(el ? el.value : S.tasaInput);
  if(!Number.isFinite(v) || v <= 0){ toast('Ingrese una tasa válida mayor a 0', 'err'); return; }
  S.config.tasa = round2(v); S.tasaInput = '';
  persist(); render();
  toast('Tasa actualizada: '+fmtTasa(v)+' Bs/$');
}
function gastoAdd(){
  const g = S.gastoForm;
  if(!g.concepto.trim() || num(g.monto) <= 0){ toast('Complete concepto y monto del gasto', 'err'); return; }
  S.gastos.push({id:uid(), fecha:g.fecha||todayISO(), concepto:g.concepto.trim(), categoria:g.categoria, monto:round2(num(g.monto)), metodo:g.metodo});
  S.gastoForm = {fecha:todayISO(), concepto:'', categoria:g.categoria, monto:'', metodo:g.metodo};
  persist(); render();
  toast('Gasto registrado: '+fmtUSD(round2(num(g.monto))));
}
function gastoDel(id){
  S.gastos = S.gastos.filter(x => x.id !== id);
  persist(); render();
  toast('Gasto eliminado', 'err');
}
function sedeAdd(){
  const v = (S.sedeInput||'').trim().toUpperCase();
  if(!v){ toast('Escriba el nombre de la sede', 'err'); return; }
  if(S.config.sedes.includes(v)){ toast('Esa sede ya existe', 'err'); return; }
  S.config.sedes.push(v); S.sedeInput = '';
  persist(); render();
  toast('Sede agregada: '+v);
}
function sedeDel(i){
  S.config.sedes.splice(i, 1);
  persist(); render();
  toast('Sede eliminada', 'err');
}

/* ================================================================
   11. EVENTOS (delegación global)
   ================================================================ */
function setPath(path, val){
  const parts = path.split('.');
  let o = S;
  for(let i = 0; i < parts.length - 1; i++){
    const k = parts[i];
    if(o[k] === undefined) o[k] = {};
    o = o[k];
  }
  o[parts[parts.length-1]] = val;
}

function onAct(act, el){
  switch(act){
    case 'save': guardar(); break;
    case 'del':
      if(!draftExists()) toast('La orden en edición aún no está registrada', 'info');
      else { S.modal = {tipo:'delReg', id:S.draft.id}; render(); }
      break;
    case 'buscar': S.buscarQ = ''; S.modal = {tipo:'buscar'}; render(); break;
    case 'nueva': nuevaOrden(); break;
    case 'empleado': toggleEmpleado(); break;
    case 'empleado-on': toggleEmpleado(); break;
    case 'tab': irATab(el.dataset.id); break;
    case 'cargar': cargarOrden(el.dataset.id); break;
    case 'del-registro': S.modal = {tipo:'delReg', id:el.dataset.id}; render(); break;
    case 'del-registro-ok': if(S.modal && S.modal.id) eliminarOrden(S.modal.id); S.modal = null; render(); break;
    case 'avanzar': avanzar(el.dataset.id); break;
    case 'stock': {
      const it = S.catalogo.find(x => x.codigo === el.dataset.id);
      if(it){ it.stock = Math.max(0, it.stock + parseInt(el.dataset.d, 10)); persist(); render();
        if(it.stock === 0) toast(it.codigo+' quedó AGOTADO', 'err');
        else if(it.stock <= it.min) toast(it.codigo+' en stock bajo ('+it.stock+')', 'info'); }
      break; }
    case 'add-pago':
      if(S.draft.pagos.length < 6){ S.draft.pagos.push({usd:'',bs:'',metodo:'PAGO MÓVIL'}); persistDraft(); render(); }
      break;
    case 'del-pago':
      S.draft.pagos.splice(parseInt(el.dataset.idx,10), 1); persistDraft(); render(); break;
    case 'gasto-add': gastoAdd(); break;
    case 'gasto-del': gastoDel(el.dataset.id); break;
    case 'sede-add': sedeAdd(); break;
    case 'sede-del': sedeDel(parseInt(el.dataset.idx,10)); break;
    case 'tasa-aplicar': tasaAplicar(); break;
    case 'backup': backup(); break;
    case 'import-click': { const f = $('#import-file'); if(f) f.click(); break; }
    case 'reset': S.modal = {tipo:'reset'}; render(); break;
    case 'reset-ok': resetDemo(); break;
    case 'modal-cerrar': S.modal = null; render(); break;
    case 'modal-bg': S.modal = null; render(); break;
    case 'pin-abrir': S.pin = ''; S.pinError = false; S.modal = {tipo:'pin'}; render(); break;
    case 'pin-ok': pinOk(); break;
    case 'buscar-pick': { const id = el.dataset.id; S.modal = null; render(); cargarOrden(id); break; }
    case 'nueva-ok': S.modal = null; S.draft = blankOrder(nextOrderId()); persistDraft(); S.tab = 'formulario'; render(); toast('Nueva orden en edición: '+S.draft.id, 'info'); break;
    case 'export-ventas': exportCSV(); break;
  }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  /* un clic dentro de la tarjeta del modal no debe cerrarlo */
  if(el.dataset.act === 'modal-bg' && e.target.closest('.modal-card')) return;
  onAct(el.dataset.act, el);
});

function onInput(el){
  if(el.id === 'tasa-input'){ S.tasaInput = el.value; return; }
  if(!el.dataset || !el.dataset.k) return;
  setPath(el.dataset.k, el.value);
  if(el.dataset.k === 'pin') S.pinError = false;
  /* los borradores se persisten al vuelo */
  if(el.dataset.k.indexOf('draft.') === 0) persistDraft();
  else if(el.dataset.k.indexOf('config.') === 0 || el.dataset.k === 'mes') persist();
  render();
}
document.addEventListener('input', e => onInput(e.target));
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'import-file'){ if(el.files && el.files[0]) importFile(el.files[0]); el.value = ''; return; }
  if(el.dataset && el.dataset.k && (el.tagName === 'SELECT' || el.type === 'date' || el.type === 'month')) onInput(el);
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){ e.preventDefault(); guardar(); }
  else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); S.buscarQ=''; S.modal={tipo:'buscar'}; render(); }
  else if(e.altKey && e.key.toLowerCase() === 'n'){ e.preventDefault(); nuevaOrden(); }
  else if(e.key === 'Escape' && S.modal){ S.modal = null; render(); }
  else if(e.key === 'Enter' && S.modal && S.modal.tipo === 'pin'){ pinOk(); }
});

/* ================================================================
   12. RELOJ E INICIO
   ================================================================ */
function tick(){
  const now = new Date();
  const el = $('#clock');
  if(el) el.textContent = now.toLocaleDateString('es-VE',{day:'2-digit',month:'short'}) + ' · ' + now.toLocaleTimeString('es-VE');
}
loadState();
S.tasaInput = '';
render();
tick();
setInterval(tick, 1000);
</script>
